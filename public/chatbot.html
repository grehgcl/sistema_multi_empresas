<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="empresa-id" content="">
    <title>Chatbot - SEE&AGENDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/chatbot.css">
    <style>
        /* Reset e base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border-radius: 0;
        }

        /* HEADER */
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            min-height: 60px;
        }
        .chat-header .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .chat-header .info h2 { font-size: 16px; font-weight: 600; margin: 0; }
        .chat-header .info p { font-size: 11px; opacity: 0.85; margin: 1px 0 0; }

        /* BANNER DE ANÚNCIO FIXO */
        .ads-header {
            flex-shrink: 0;
            background: #fff;
            border-bottom: 1px solid #e8ecf1;
            padding: 10px 14px;
            min-height: 64px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .ads-header:active { transform: scale(0.995); }
        .ads-header .ads-emoji { font-size: 26px; flex-shrink: 0; }
        .ads-header .ads-info { flex: 1; min-width: 0; }
        .ads-header .ads-title {
            font-weight: 700; font-size: 14px; margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ads-header .ads-desc {
            font-size: 12px; color: #4b5563; line-height: 1.3;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ads-header .ads-badge {
            background: #667eea; color: #fff; padding: 2px 8px;
            border-radius: 10px; font-size: 9px; font-weight: 700;
            flex-shrink: 0; letter-spacing: 0.3px;
        }
        .ads-header.ads-fade-out { opacity: 0; transform: translateY(-4px); }
        .ads-header.ads-fade-in  { opacity: 1; transform: translateY(0); }

        /* MESSAGES */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #f8f9fc;
        }

        .message {
            display: flex; gap: 8px; max-width: 92%;
            animation: fadeIn 0.3s ease;
        }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .message-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: #e8ecf1;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #555; flex-shrink: 0;
        }
        .message.bot .message-avatar { background: #667eea; color: white; }
        .message.user .message-avatar { background: #10b981; color: white; }

        .message-content {
            background: white; padding: 8px 12px; border-radius: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            position: relative; max-width: 100%;
            word-wrap: break-word; overflow-wrap: break-word;
            min-width: 0; flex: 1;
        }
        .message.bot .message-content { border-top-left-radius: 3px; background: white; }
        .message.user .message-content { border-top-right-radius: 3px; background: #667eea; color: white; }

        .message-text { font-size: 14px; line-height: 1.4; word-wrap: break-word; overflow-wrap: break-word; }
        .message-text strong { color: #667eea; }
        .message.user .message-text strong { color: #fff; }

        .message-time { font-size: 9px; color: #999; display: block; margin-top: 4px; text-align: right; }
        .message.user .message-time { color: rgba(255,255,255,0.7); }

        /* BOTÕES */
        .message-buttons {
            display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; width: 100%;
        }
        .message-btn {
            padding: 5px 12px; border: 2px solid #667eea; border-radius: 16px;
            background: transparent; color: #667eea;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; white-space: nowrap;
            min-height: 28px; flex: 0 1 auto; max-width: 100%;
        }
        .message-btn.btn-primary { background: #667eea; color: white; border-color: #667eea; }
        .message-btn:hover { background: #667eea; color: white; }
        .message-btn.btn-primary:hover { background: #5a6fd6; border-color: #5a6fd6; }

        /* GRID DE SERVIÇOS */
        .opcoes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px; margin-top: 10px; width: 100%;
        }
        .opcao-card {
            background: #fff; border: 2px solid #e8ecf1; border-radius: 10px;
            padding: 8px 6px; text-align: center; cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px; font-weight: 600; color: #333;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; min-height: 60px;
            word-break: break-word; line-height: 1.2;
        }
        .opcao-card:hover {
            border-color: #667eea; background: #f5f7ff;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
        }
        .opcao-card:active { transform: scale(0.97); }
        .opcao-card .opcao-nome { font-size: 11px; font-weight: 600; color: #333; }
        .opcao-card .opcao-valor { font-size: 11px; color: #10b981; font-weight: 700; }

        .ver-mais-btn {
            grid-column: 1 / -1; background: #f0f2f5;
            border: 2px dashed #c7ccd6; border-radius: 10px;
            padding: 8px; text-align: center; cursor: pointer;
            font-size: 12px; font-weight: 600; color: #667eea;
            transition: all 0.2s; margin-top: 4px;
        }
        .ver-mais-btn:hover { background: #e8ecf1; border-color: #667eea; }
        .ver-mais-btn i { margin-right: 4px; }

        /* GRID DE HORÁRIOS */
        .horarios-wrapper { margin-top: 10px; width: 100%; }
        .horarios-grupo { margin-bottom: 10px; }
        .horarios-grupo:last-child { margin-bottom: 0; }
        .horarios-grupo-titulo {
            font-size: 11px; font-weight: 700; color: #6b7280;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex; align-items: center; gap: 5px;
        }
        .horarios-grupo-titulo i { color: #667eea; font-size: 12px; }
        .horarios-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px; width: 100%;
        }
        .horario-card {
            background: #fff; border: 2px solid #e8ecf1; border-radius: 8px;
            padding: 7px 4px; text-align: center; cursor: pointer;
            font-size: 12px; font-weight: 600; color: #333;
            transition: all 0.2s;
        }
        .horario-card:hover {
            border-color: #667eea; background: #f5f7ff;
            transform: translateY(-1px);
        }
        .horario-card:active { transform: scale(0.96); }

        /* INPUT */
        .chat-input-area {
            padding: 10px 12px; background: white;
            border-top: 1px solid #e8ecf1;
            display: flex; gap: 8px; flex-shrink: 0; min-height: 52px;
        }
        .chat-input-area input {
            flex: 1; padding: 8px 14px;
            border: 2px solid #e8ecf1; border-radius: 20px;
            font-size: 14px; outline: none;
            transition: border-color 0.2s; min-height: 36px;
        }
        .chat-input-area input:focus { border-color: #667eea; }
        .chat-input-area button {
            padding: 8px 16px; background: #667eea; color: white;
            border: none; border-radius: 20px;
            font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
            white-space: nowrap; min-height: 36px;
            display: flex; align-items: center; gap: 4px;
        }
        .chat-input-area button:hover { background: #5a6fd6; }

        /* CALENDÁRIO */
        .calendario-container {
            margin-top: 8px; background: white; border-radius: 10px;
            padding: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            width: 100%; overflow: hidden;
        }
        .calendario-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 8px;
        }
        .calendario-nav {
            background: none; border: none; font-size: 16px;
            cursor: pointer; padding: 2px 10px;
            color: #667eea; font-weight: bold;
        }
        .calendario-semana {
            display: grid; grid-template-columns: repeat(7, 1fr);
            text-align: center; font-size: 10px; color: #999;
            margin-bottom: 4px;
        }
        .calendario-dias {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
        }
        .calendario-dia {
            aspect-ratio: 1; display: flex;
            align-items: center; justify-content: center;
            font-size: 13px; border-radius: 50%;
            cursor: default; transition: all 0.2s;
            width: 100%; min-height: 32px;
        }
        .calendario-dia.vazio { visibility: hidden; }
        .calendario-dia:hover:not(.indisponivel):not(.vazio) { transform: scale(1.05); }

        /* DIGITANDO */
        .message.digitando .message-content {
            background: #e8ecf1; padding: 12px 18px;
            border-radius: 14px; border-top-left-radius: 3px;
        }
        .message.digitando .dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: #999;
            margin: 0 2px; animation: dotPulse 1.4s infinite;
        }
        .message.digitando .dot:nth-child(2) { animation-delay: 0.2s; }
        .message.digitando .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 60%, 100% { transform: scale(0.6); opacity: 0.4; }
            30% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

        /* RESPONSIVO */
        @media (max-width: 480px) {
            body { padding: 0; }
            .chat-container { height: 100vh; max-height: 100vh; border-radius: 0; }
            .chat-header { padding: 12px 14px; min-height: 52px; }
            .chat-header .avatar { width: 32px; height: 32px; font-size: 14px; }
            .chat-header .info h2 { font-size: 14px; }
            .chat-header .info p { font-size: 10px; }
            .ads-header { padding: 8px 12px; min-height: 58px; }
            .ads-header .ads-emoji { font-size: 22px; }
            .ads-header .ads-title { font-size: 13px; }
            .ads-header .ads-desc { font-size: 11px; }
            .chat-messages { padding: 8px 10px; gap: 4px; }
            .message { max-width: 95%; gap: 6px; }
            .message-avatar { width: 24px; height: 24px; font-size: 10px; }
            .message-content { padding: 6px 10px; border-radius: 10px; }
            .message-text { font-size: 13px; line-height: 1.35; }
            .message-btn { padding: 4px 10px; font-size: 11px; min-height: 24px; border-radius: 14px; }
            .message-buttons { gap: 4px; margin-top: 6px; }
            .opcoes-grid { grid-template-columns: repeat(2, 1fr); gap: 5px; }
            .opcao-card { min-height: 55px; padding: 6px 4px; font-size: 11px; }
            .opcao-card .opcao-nome { font-size: 10px; }
            .opcao-card .opcao-valor { font-size: 10px; }
            .horarios-grid { grid-template-columns: repeat(3, 1fr); gap: 4px; }
            .horario-card { font-size: 11px; padding: 6px 3px; }
            .chat-input-area { padding: 8px 10px; min-height: 44px; gap: 6px; }
            .chat-input-area input { padding: 6px 12px; font-size: 13px; min-height: 32px; border-radius: 16px; }
            .chat-input-area button { padding: 6px 14px; font-size: 13px; min-height: 32px; border-radius: 16px; }
            .calendario-container { padding: 6px; }
            .calendario-dia { font-size: 11px; min-height: 28px; }
            .calendario-nav { font-size: 14px; padding: 0 8px; }
            .calendario-semana { font-size: 9px; }
            .message.digitando .message-content { padding: 10px 14px; }
            .message.digitando .dot { width: 6px; height: 6px; }
        }

        @media (max-width: 360px) {
            .message-text { font-size: 12px; }
            .message-btn { font-size: 10px; padding: 3px 8px; min-height: 20px; }
            .chat-input-area input { font-size: 12px; padding: 4px 10px; }
            .chat-input-area button { font-size: 12px; padding: 4px 10px; }
            .calendario-dia { font-size: 10px; min-height: 24px; }
            .opcoes-grid { grid-template-columns: repeat(2, 1fr); }
            .horarios-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* DARK MODE */
        @media (prefers-color-scheme: dark) {
            body { background: #1a1a2e; }
            .chat-container { background: #16213e; }
            .chat-header { background: linear-gradient(135deg, #4a3f8a, #5a4f9a); }
            .ads-header { background: #1a1a2e; border-bottom-color: #2d3748; }
            .ads-header .ads-desc { color: #a0aec0; }
            .chat-messages { background: #1a1a2e; }
            .message.bot .message-content { background: #2d3748; color: #e2e8f0; }
            .message.user .message-content { background: #667eea; color: white; }
            .message-avatar { background: #2d3748; color: #a0aec0; }
            .message.bot .message-avatar { background: #667eea; color: white; }
            .chat-input-area { background: #1a1a2e; border-top-color: #2d3748; }
            .chat-input-area input { background: #2d3748; border-color: #4a5568; color: #e2e8f0; }
            .chat-input-area input:focus { border-color: #667eea; }
            .chat-input-area input::placeholder { color: #718096; }
            .message-text strong { color: #93a3f8; }
            .message-time { color: #718096; }
            .calendario-container { background: #2d3748; }
            .calendario-dia { color: #e2e8f0; }
            .calendario-dia.indisponivel { color: #4a5568; }
            .calendario-nav { color: #93a3f8; }
            .calendario-semana { color: #718096; }
            .message-btn { border-color: #667eea; color: #93a3f8; }
            .message-btn:hover { background: #667eea; color: white; }
            .message-btn.btn-primary { background: #667eea; color: white; border-color: #667eea; }
            .message-btn.btn-primary:hover { background: #5a6fd6; }
            .message.digitando .message-content { background: #2d3748; }
            .message.digitando .dot { background: #718096; }
            .opcao-card { background: #2d3748; border-color: #4a5568; color: #e2e8f0; }
            .opcao-card .opcao-nome { color: #e2e8f0; }
            .opcao-card:hover { background: #374151; border-color: #667eea; }
            .ver-mais-btn { background: #2d3748; border-color: #4a5568; color: #93a3f8; }
            .ver-mais-btn:hover { background: #374151; }
            .horario-card { background: #2d3748; border-color: #4a5568; color: #e2e8f0; }
            .horario-card:hover { background: #374151; border-color: #667eea; }
            .horarios-grupo-titulo { color: #a0aec0; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar"><i class="fas fa-robot"></i></div>
            <div class="info">
                <h2 id="empresaNome">See&Agende</h2>
                <p>💬 Atendimento online</p>
            </div>
        </div>

        <div class="ads-header" id="adsHeader"></div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Digite sua mensagem..." autofocus>
            <button onclick="enviarMensagem()">
                <i class="fas fa-paper-plane"></i> Enviar
            </button>
        </div>
    </div>

    <script>
    // ============================================
    // VARIÁVEIS GLOBAIS
    // ============================================
    let estado = 'inicio';
    let clienteAtual = null;
    let agendamentoAtual = {};
    let empresaId = null;
    let servicosList = [];
    let profissionaisList = [];
    let dadosEmpresa = null;
    let datasDisponiveis = [];
    let horariosDisponiveis = [];
    let calendarioAtual = new Date();
    let nomeCliente = '';
    let telefoneCliente = '';
    let isClienteExistente = false;
    let estaDigitando = false;

    const respostasHumanas = {
        'boas_vindas': ['Olá! 👋 Tudo bem?', 'Oii! 😊 Que bom te ver por aqui!', 'Oi! 🎉 Como posso ajudar você hoje?'],
        'cliente_encontrado': ['Que bom te ver de novo! 😍', 'Ah, você já é da casa! ✨', 'Cliente antigo é sempre especial! 🥰'],
        'cadastro_sucesso': ['Uhuul! Cadastro feito com sucesso! 🎉', 'Bem-vindo(a) à nossa família! 🤗', 'Que legal! Agora você faz parte da nossa história! 💫'],
        'confirmar': ['Perfeito! 😍 Vou confirmar seu agendamento agora...', 'Maravilha! ✨ Só um minutinho que já confirmo...', 'Show! 🎉 Já estou confirmando tudo certinho...'],
        'sucesso': ['Feito! 🎉 Seu horário está reservado! Te esperamos!', 'Confirmado! ✅ Arrase nesse dia especial!', 'Uhuul! 🥳 Agendamento realizado com sucesso!'],
        'erro': ['Opa! 😅 Algo deu errado. Vamos tentar de novo?', 'Putz! 😬 Tivemos um probleminha. Bora tentar novamente?', 'Eita! 🫠 Deu ruim aqui. Vamos recomeçar?'],
        'cancelar': ['Tudo bem! 😊 Quando quiser, estamos aqui.', 'Sem problemas! ✨ Qualquer coisa é só chamar.', 'Acontece! 🤗 Estamos à disposição.']
    };

    function getMensagemHumanizada(tipo) {
        const opcoes = respostasHumanas[tipo] || ['Ok! 😊'];
        return opcoes[Math.floor(Math.random() * opcoes.length)];
    }

    // ============================================
    // EFEITO DE DIGITANDO
    // ============================================
    function mostrarDigitando() {
        if (estaDigitando) return;
        estaDigitando = true;
        const container = document.getElementById('chatMessages');
        if (!container) return;
        esconderDigitando();
        const div = document.createElement('div');
        div.className = 'message bot digitando';
        div.id = 'digitandoIndicator';
        div.innerHTML = `
            <div class="message-avatar"><i class="fas fa-robot"></i></div>
            <div class="message-content">
                <div class="message-text">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
            </div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function esconderDigitando() {
        estaDigitando = false;
        const indicator = document.getElementById('digitandoIndicator');
        if (indicator) indicator.remove();
    }

    function adicionarMensagemComDelay(texto, tipo, extra = null, delay = 800) {
        return new Promise((resolve) => {
            mostrarDigitando();
            const tempoAleatorio = 800 + Math.random() * 1200;
            setTimeout(() => {
                esconderDigitando();
                adicionarMensagem(texto, tipo, extra);
                resolve();
            }, tempoAleatorio);
        });
    }

    function adicionarMensagemComBotoesComDelay(texto, botoes, delay = 1000) {
        return new Promise((resolve) => {
            mostrarDigitando();
            const tempoAleatorio = 800 + Math.random() * 1200;
            setTimeout(() => {
                esconderDigitando();
                adicionarMensagemComBotoes(texto, botoes);
                resolve();
            }, tempoAleatorio);
        });
    }

    // ============================================
    // INICIALIZAR
    // ============================================
    document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        empresaId = params.get('empresa') || '1';

        if (empresaId) {
            localStorage.setItem('chatbot_empresa_id', empresaId);
            window._empresaId = empresaId;
            document.querySelector('meta[name="empresa-id"]').setAttribute('content', empresaId);
        }

        const container = document.getElementById('chatMessages');
        if (container) container.innerHTML = '';

        carregarDadosEmpresa();

        document.getElementById('chatInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensagem();
        });

        setTimeout(() => document.getElementById('chatInput').focus(), 500);
    });

    // ============================================
    // CARREGAR DADOS DA EMPRESA
    // ============================================
    async function carregarDadosEmpresa() {
        try {
            const res = await fetch(`/api/chatbot/empresa/${empresaId}`);
            const data = await res.json();

            if (data.success && data.data) {
                dadosEmpresa = data.data;
                document.getElementById('empresaNome').textContent = dadosEmpresa.nome || 'See&Agende';

                await carregarServicos();
                await carregarProfissionais();

                const nomeEmpresa = dadosEmpresa.nome || 'nossa empresa';
                const saudacao = getMensagemHumanizada('boas_vindas');

                adicionarMensagemComBotoesComDelay(
                    `${saudacao}<br><br>` +
                    `Seja bem-vindo à <strong>${nomeEmpresa}</strong>! 💇‍♂️<br><br>` +
                    `Posso ajudar você a agendar um horário de forma rápida e fácil.<br><br>` +
                    `<strong>Você já é cliente da ${nomeEmpresa}?</strong>`,
                    [
                        { label: '✅ Sim, já sou cliente', valor: 'sim', primary: true },
                        { label: '➕ Não, sou novo cliente', valor: 'não', primary: false }
                    ],
                    1500
                );
                estado = 'aguardando_cliente';
            } else {
                adicionarMensagemComDelay('❌ Não foi possível carregar a empresa. Link inválido.', 'bot', null, 500);
            }
        } catch (error) {
            console.error('❌ Erro ao carregar empresa:', error);
            adicionarMensagemComDelay('❌ Erro ao carregar. Tente novamente mais tarde.', 'bot', null, 500);
        }
    }

    async function carregarServicos() {
        try {
            const res = await fetch(`/api/chatbot/servicos/${empresaId}`);
            const data = await res.json();
            if (data.success) {
                servicosList = data.servicos || data.data || [];
            } else {
                servicosList = [];
            }
        } catch (error) {
            console.error('❌ Erro ao carregar serviços:', error);
            servicosList = [];
        }
    }

    async function carregarProfissionais() {
        try {
            const res = await fetch(`/api/chatbot/profissionais/${empresaId}`);
            const data = await res.json();
            profissionaisList = [];

            if (data.success) {
                const profs = data.profissionais || data.data || [];
                for (let p of profs) {
                    profissionaisList.push({
                        id: p.id, nome: p.nome,
                        comissao_percent: p.comissao_percent || 0,
                        ativo: p.ativo
                    });
                }
            }

            const donoNome = dadosEmpresa?.nome_dono || 'Dono';
            const jaExisteDono = profissionaisList.some(p =>
                p.isDono === true || p.nome.includes('(Dono)') || p.nome.toLowerCase() === 'dono'
            );

            if (!jaExisteDono) {
                profissionaisList.push({
                    id: 'dono_' + Date.now(), nome: donoNome + ' (Dono)',
                    comissao_percent: 0, isDono: true, ativo: 1
                });
            }
        } catch (error) {
            console.error('❌ Erro ao carregar profissionais:', error);
            profissionaisList = [{
                id: 'dono_fallback', nome: 'Dono (Proprietário)',
                comissao_percent: 0, isDono: true, ativo: 1
            }];
        }
    }

    function enviarMensagem() {
        const input = document.getElementById('chatInput');
        const texto = input.value.trim();
        if (!texto) return;
        adicionarMensagem(texto, 'user');
        input.value = '';
        processarResposta(texto);
    }

    function adicionarMensagem(texto, tipo, extra = null) {
        const container = document.getElementById('chatMessages');
        if (!container) return;

        const div = document.createElement('div');
        div.className = `message ${tipo}`;

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.innerHTML = tipo === 'bot' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';

        const content = document.createElement('div');
        content.className = 'message-content';

        const text = document.createElement('div');
        text.className = 'message-text';
        text.innerHTML = texto;

        const time = document.createElement('span');
        time.className = 'message-time';
        const now = new Date();
        time.textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        content.appendChild(text);
        if (extra) content.appendChild(extra);
        content.appendChild(time);

        div.appendChild(avatar);
        div.appendChild(content);
        container.appendChild(div);

        container.scrollTop = container.scrollHeight;
        document.getElementById('chatInput').focus();
    }

    function adicionarMensagemComServicos(texto, servicos) {
        const container = document.getElementById('chatMessages');
        if (!container) return;

        const div = document.createElement('div');
        div.className = 'message bot';

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.innerHTML = '<i class="fas fa-robot"></i>';

        const content = document.createElement('div');
        content.className = 'message-content';

        const text = document.createElement('div');
        text.className = 'message-text';
        text.innerHTML = texto;

        const time = document.createElement('span');
        time.className = 'message-time';
        const now = new Date();
        time.textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        const grid = document.createElement('div');
        grid.className = 'opcoes-grid';

        const LIMITE_INICIAL = 6;
        let expandido = false;

        function renderizarServicos() {
            grid.innerHTML = '';
            const visiveis = expandido ? servicos : servicos.slice(0, LIMITE_INICIAL);

            for (let s of visiveis) {
                const card = document.createElement('div');
                card.className = 'opcao-card';
                const valor = parseFloat(s.valor) || 0;
                const valorFormatado = valor.toFixed(2).replace('.', ',');
                card.innerHTML = `
                    <div class="opcao-nome">${s.nome}</div>
                    <div class="opcao-valor">R$ ${valorFormatado}</div>
                `;
                card.onclick = function() {
                    adicionarMensagem(s.nome, 'user');
                    processarResposta(s.nome);
                };
                grid.appendChild(card);
            }

            if (servicos.length > LIMITE_INICIAL) {
                const btnVerMais = document.createElement('div');
                btnVerMais.className = 'ver-mais-btn';
                if (expandido) {
                    btnVerMais.innerHTML = '<i class="fas fa-chevron-up"></i> Ver menos';
                } else {
                    const restantes = servicos.length - LIMITE_INICIAL;
                    btnVerMais.innerHTML = `<i class="fas fa-chevron-down"></i> Ver mais ${restantes} serviço${restantes > 1 ? 's' : ''}`;
                }
                btnVerMais.onclick = function() {
                    expandido = !expandido;
                    renderizarServicos();
                    container.scrollTop = container.scrollHeight;
                };
                grid.appendChild(btnVerMais);
            }
        }

        renderizarServicos();

        content.appendChild(text);
        content.appendChild(grid);
        content.appendChild(time);

        div.appendChild(avatar);
        div.appendChild(content);
        container.appendChild(div);

        container.scrollTop = container.scrollHeight;
        document.getElementById('chatInput').focus();
    }

    function adicionarMensagemComHorarios(texto, horarios) {
        const container = document.getElementById('chatMessages');
        if (!container) return;

        const div = document.createElement('div');
        div.className = 'message bot';

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.innerHTML = '<i class="fas fa-robot"></i>';

        const content = document.createElement('div');
        content.className = 'message-content';

        const text = document.createElement('div');
        text.className = 'message-text';
        text.innerHTML = texto;

        const time = document.createElement('span');
        time.className = 'message-time';
        const now = new Date();
        time.textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        const grupos = {
            manha: { titulo: 'Manhã', icone: 'fa-sun', horarios: [] },
            tarde: { titulo: 'Tarde', icone: 'fa-cloud-sun', horarios: [] },
            noite: { titulo: 'Noite', icone: 'fa-moon', horarios: [] }
        };

        for (let h of horarios) {
            const hora = parseInt(h.split(':')[0]);
            if (hora < 12) grupos.manha.horarios.push(h);
            else if (hora < 18) grupos.tarde.horarios.push(h);
            else grupos.noite.horarios.push(h);
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'horarios-wrapper';

        for (let key of ['manha', 'tarde', 'noite']) {
            const grupo = grupos[key];
            if (grupo.horarios.length === 0) continue;

            const grupoDiv = document.createElement('div');
            grupoDiv.className = 'horarios-grupo';

            const titulo = document.createElement('div');
            titulo.className = 'horarios-grupo-titulo';
            titulo.innerHTML = `<i class="fas ${grupo.icone}"></i> ${grupo.titulo}`;
            grupoDiv.appendChild(titulo);

            const grid = document.createElement('div');
            grid.className = 'horarios-grid';

            for (let h of grupo.horarios) {
                const card = document.createElement('div');
                card.className = 'horario-card';
                card.textContent = h;
                card.onclick = function() {
                    adicionarMensagem(h, 'user');
                    processarResposta(h);
                };
                grid.appendChild(card);
            }

            grupoDiv.appendChild(grid);
            wrapper.appendChild(grupoDiv);
        }

        content.appendChild(text);
        content.appendChild(wrapper);
        content.appendChild(time);

        div.appendChild(avatar);
        div.appendChild(content);
        container.appendChild(div);

        container.scrollTop = container.scrollHeight;
        document.getElementById('chatInput').focus();
    }

    // ============================================
    // PROCESSAR RESPOSTA
    // ============================================
    async function processarResposta(texto) {
        const mensagem = texto.trim().toLowerCase();

        switch (estado) {
            case 'aguardando_cliente': {
                const isSim = mensagem.includes('sim');
                const isNao = mensagem.includes('não') || mensagem.includes('nao');

                if (isSim) {
                    isClienteExistente = true;
                    estado = 'aguardando_telefone_cliente';
                    adicionarMensagemComDelay(
                        `Que legal! 👍 ${getMensagemHumanizada('cliente_encontrado')}<br><br>` +
                        `Digite seu <strong>telefone</strong> com DDD:<br><br><em>Ex: 11999999999</em>`,
                        'bot', null, 600
                    );
                } else if (isNao) {
                    isClienteExistente = false;
                    estado = 'aguardando_nome_novo';
                    adicionarMensagemComDelay(
                        `Tudo bem! Vamos fazer seu cadastro rapidinho. ✨<br><br>Digite seu <strong>nome completo</strong>:`,
                        'bot', null, 600
                    );
                } else {
                    adicionarMensagemComBotoes(
                        'Por favor, escolha uma das opções:',
                        [
                            { label: '✅ Sim, já sou cliente', valor: 'sim', primary: true },
                            { label: '➕ Não, sou novo cliente', valor: 'não', primary: false }
                        ]
                    );
                }
                break;
            }

            case 'aguardando_telefone_cliente': {
                const telefone = texto.replace(/\D/g, '');
                if (telefone.length >= 10 && telefone.length <= 11) {
                    telefoneCliente = telefone;
                    buscarClientePorTelefone(telefoneCliente);
                } else {
                    adicionarMensagemComDelay('⚠️ Por favor, informe um telefone válido com DDD (ex: 11999999999):', 'bot', null, 500);
                }
                break;
            }

            case 'aguardando_nome_novo':
                if (mensagem.length >= 3) {
                    nomeCliente = texto.trim();
                    estado = 'aguardando_telefone_novo';
                    adicionarMensagemComDelay(
                        `Prazer, <strong>${nomeCliente}</strong>! ✨<br><br>Digite seu <strong>telefone</strong> com DDD:`,
                        'bot', null, 600
                    );
                } else {
                    adicionarMensagemComDelay('Digite seu <strong>nome completo</strong> (mínimo 3 caracteres):', 'bot', null, 500);
                }
                break;

            case 'aguardando_telefone_novo': {
                const telefone = texto.replace(/\D/g, '');
                if (telefone.length >= 10 && telefone.length <= 11) {
                    telefoneCliente = telefone;
                    cadastrarNovoCliente(nomeCliente, telefoneCliente);
                } else {
                    adicionarMensagemComDelay('⚠️ Telefone inválido. Digite com DDD (ex: 11999999999):', 'bot', null, 500);
                }
                break;
            }

            case 'aguardando_servico': {
                if (servicosList.length === 0) {
                    adicionarMensagemComDelay(
                        '❌ Desculpe, não há serviços disponíveis no momento.<br><br>Por favor, entre em contato com a barbearia.',
                        'bot', null, 600
                    );
                    estado = 'inicio';
                    return;
                }

                const servicoEncontrado = servicosList.find(s =>
                    s.nome.toLowerCase().includes(mensagem) ||
                    mensagem.includes(s.nome.toLowerCase())
                );

                if (servicoEncontrado) {
                    agendamentoAtual.servico_id = servicoEncontrado.id;
                    agendamentoAtual.servico_nome = servicoEncontrado.nome;
                    agendamentoAtual.valor = parseFloat(servicoEncontrado.valor) || 0;
                    agendamentoAtual.duracao = servicoEncontrado.duracao || 30;
                    estado = 'aguardando_profissional';
                    perguntarProfissional();
                } else {
                    mostrarServicos();
                }
                break;
            }

            case 'aguardando_profissional': {
                if (mensagem.includes('qualquer')) {
                    agendamentoAtual.profissional_id = null;
                    agendamentoAtual.profissional_nome = 'Qualquer profissional';
                    estado = 'aguardando_data';
                    perguntarData();
                } else {
                    const profissional = profissionaisList.find(p =>
                        p.nome.toLowerCase().includes(mensagem) ||
                        mensagem.includes(p.nome.toLowerCase())
                    );
                    if (profissional) {
                        agendamentoAtual.profissional_id = profissional.isDono ? null : profissional.id;
                        agendamentoAtual.profissional_nome = profissional.nome;
                        estado = 'aguardando_data';
                        perguntarData();
                    } else {
                        perguntarProfissional();
                    }
                }
                break;
            }

            case 'aguardando_data': {
                const dataSelecionada = texto.match(/\d{4}-\d{2}-\d{2}/);
                if (dataSelecionada) {
                    agendamentoAtual.data = dataSelecionada[0];
                    estado = 'aguardando_horario';
                    perguntarHorario(agendamentoAtual.data);
                } else {
                    adicionarMensagemComDelay('⚠️ Por favor, clique em uma data disponível no calendário.', 'bot', null, 500);
                }
                break;
            }

            case 'aguardando_horario': {
                const horarioSelecionado = horariosDisponiveis.find(h => h === texto);
                if (horarioSelecionado) {
                    agendamentoAtual.hora = horarioSelecionado;
                    estado = 'confirmando';
                    confirmarAgendamento();
                } else {
                    adicionarMensagemComDelay('⚠️ Por favor, escolha um dos horários mostrados acima.', 'bot', null, 500);
                }
                break;
            }

            case 'confirmando': {
                const isSimConfirm = mensagem === 'sim' || mensagem.includes('sim');
                if (isSimConfirm) {
                    const msg = getMensagemHumanizada('confirmar');
                    adicionarMensagemComDelay(msg, 'bot', null, 600);
                    verificarEConfirmar();
                } else if (mensagem === 'não' || mensagem === 'nao' || mensagem.includes('não') || mensagem.includes('nao')) {
                    estado = 'inicio';
                    agendamentoAtual = {};
                    const msgCancel = getMensagemHumanizada('cancelar');
                    adicionarMensagemComDelay(`❌ ${msgCancel}`, 'bot', null, 500);
                    setTimeout(() => {
                        const nomeEmpresa = dadosEmpresa?.nome || 'nossa empresa';
                        const saudacao = getMensagemHumanizada('boas_vindas');
                        adicionarMensagemComBotoesComDelay(
                            `${saudacao}<br><br>Seja bem-vindo à <strong>${nomeEmpresa}</strong>! 💇‍♂️<br><br><strong>Você já é cliente?</strong>`,
                            [
                                { label: '✅ Sim', valor: 'sim', primary: true },
                                { label: '➕ Não', valor: 'não', primary: false }
                            ],
                            1000
                        );
                        estado = 'aguardando_cliente';
                    }, 1500);
                } else {
                    confirmarAgendamento();
                }
                break;
            }

            // ============================================
            // 🧠 NOVOS ESTADOS — MEMÓRIA DO CLIENTE
            // ============================================
            case 'aguardando_escolha_rapida': {
                if (texto === '__repetir_ultimo__' || mensagem.includes('repetir')) {
                    const hist = window._historicoCliente;
                    if (hist && hist.sugestoes && hist.sugestoes.ultimoAtendimento) {
                        const u = hist.sugestoes.ultimoAtendimento;
                        const nomeServicoLimpo = (u.servico || '').trim().toLowerCase();
                        const servico = servicosList.find(s =>
                            s.nome.trim().toLowerCase() === nomeServicoLimpo
                        );

                        if (servico) {
                            agendamentoAtual.servico_id = servico.id;
                            agendamentoAtual.servico_nome = servico.nome;
                            agendamentoAtual.valor = parseFloat(servico.valor) || 0;
                            agendamentoAtual.duracao = servico.duracao || 30;
                        } else {
                            agendamentoAtual.servico_nome = u.servico;
                            agendamentoAtual.valor = parseFloat(u.valor) || 0;
                            agendamentoAtual.duracao = 30;
                        }

                        if (u.profissional) {
                            const prof = profissionaisList.find(p =>
                                p.nome.toLowerCase().includes(u.profissional.toLowerCase()) ||
                                u.profissional.toLowerCase().includes(p.nome.toLowerCase())
                            );
                            if (prof) {
                                agendamentoAtual.profissional_id = prof.isDono ? null : prof.id;
                                agendamentoAtual.profissional_nome = prof.nome;
                            }
                        }

                        await adicionarMensagemComDelay(
                            `🔁 Perfeito! Vou repetir seu último atendimento:<br><br>` +
                            `✂️ <strong>${agendamentoAtual.servico_nome}</strong><br>` +
                            (agendamentoAtual.profissional_nome ? `👨‍💼 ${agendamentoAtual.profissional_nome}<br>` : '') +
                            `<br>Vamos escolher a data?`,
                            'bot', null, 600
                        );

                        if (hist.sugestoes.diaSemanaFavorito) {
                            const diaFav = hist.sugestoes.diaSemanaFavorito.dia;
                            const horaFav = hist.sugestoes.horaFavorita ? hist.sugestoes.horaFavorita.hora : null;
                            const proximaData = proximaDataPorDiaSemana(diaFav);

                            setTimeout(async () => {
                                const botoes = [
                                    {
                                        label: `📅 ${nomeDiaSemana(diaFav)}${horaFav ? ' às ' + horaFav : ''}`,
                                        valor: `__sugestao_data__|${proximaData}${horaFav ? '|' + horaFav : ''}`,
                                        primary: true
                                    },
                                    {
                                        label: '📅 Escolher outra data',
                                        valor: '__escolher_data__',
                                        primary: false
                                    }
                                ];
                                await adicionarMensagemComBotoesComDelay(
                                    `💡 <strong>Notei que você costuma vir ${nomeDiaSemana(diaFav)}${horaFav ? ' às ' + horaFav : ''}.</strong><br><br>Quer que eu já reserve pra essa data?`,
                                    botoes,
                                    800
                                );
                                estado = 'aguardando_confirmacao_sugestao';
                            }, 1200);
                        } else {
                            estado = 'aguardando_data';
                            setTimeout(() => perguntarData(), 800);
                        }
                    }
                } else if (texto === '__novo_servico__' || mensagem.includes('outro')) {
                    estado = 'aguardando_servico';
                    await new Promise(r => setTimeout(r, 200));
                    mostrarServicos();
                } else {
                    estado = 'aguardando_servico';
                    processarResposta(texto);
                }
                break;
            }

            case 'aguardando_confirmacao_sugestao': {
                if (texto.startsWith('__sugestao_data__')) {
                    const partes = texto.split('|');
                    const dataSugerida = partes[1];
                    const horaSugerida = partes[2] || null;
                    agendamentoAtual.data = dataSugerida;

                    await adicionarMensagemComDelay(
                        `📅 Perfeito! ${formatarDataBr(dataSugerida)} então.`,
                        'bot', null, 500
                    );

                                        if (horaSugerida) {
                        estado = 'aguardando_horario';
                        setTimeout(async () => {
                            await perguntarHorario(dataSugerida);
                            setTimeout(async () => {
                                if (horariosDisponiveis.includes(horaSugerida)) {
                                    // ✅ Cenário feliz: hora tá livre
                                    await adicionarMensagemComBotoesComDelay(
                                        `💡 <strong>E o horário das ${horaSugerida}?</strong>`,
                                        [
                                            { label: `⏰ Sim, ${horaSugerida}`, valor: horaSugerida, primary: true },
                                            { label: '🕐 Outro horário', valor: '__outro_horario__', primary: false }
                                        ],
                                        600
                                    );
                                    estado = 'aguardando_horario';
                                } else if (horariosDisponiveis.length > 0) {
                                    // 🅰️ Data livre, mas hora ocupada
                                    await adicionarMensagemComDelay(
                                        `⚠️ <strong>Ops!</strong> O horário das <strong>${horaSugerida}</strong> já está ocupado nesse dia.<br><br>` +
                                        `Mas relaxa! Aqui estão os horários disponíveis pra ${formatarDataBr(dataSugerida)}:`,
                                        'bot', null, 500
                                    );
                                    estado = 'aguardando_horario';
                                    // Os horários já foram mostrados pelo perguntarHorario acima
                                } else {
                                    // 🅱️ Dia inteiro cheio — sugere próximas datas
                                    await adicionarMensagemComDelay(
                                        `⚠️ <strong>Poxa, esse dia já está cheio!</strong> 😔<br><br>` +
                                        `Vou buscar outras datas próximas...`,
                                        'bot', null, 500
                                    );
                                    
                                    // Busca as próximas 3 datas disponíveis
                                    setTimeout(async () => {
                                        const proximasDatas = [];
                                        let diasFrente = 1;
                                        let tentativas = 0;
                                        const maxTentativas = 30; // até 30 dias à frente
                                        
                                        while (proximasDatas.length < 3 && tentativas < maxTentativas) {
                                            const dataCheck = new Date(dataSugerida + 'T12:00:00');
                                            dataCheck.setDate(dataCheck.getDate() + diasFrente);
                                            const dataStr = dataCheck.toISOString().split('T')[0];
                                            
                                            try {
                                                const resCheck = await fetch('/api/chatbot/horarios-disponiveis', {
                                                    method: 'POST',
                                                    headers: { 'Content-Type': 'application/json' },
                                                    body: JSON.stringify({
                                                        empresaId,
                                                        profissionalId: agendamentoAtual.profissional_id,
                                                        data: dataStr
                                                    })
                                                });
                                                const resultCheck = await resCheck.json();
                                                if (resultCheck.success && resultCheck.horarios && resultCheck.horarios.length > 0) {
                                                    proximasDatas.push(dataStr);
                                                }
                                            } catch (e) {}
                                            
                                            diasFrente++;
                                            tentativas++;
                                        }
                                        
                                        if (proximasDatas.length > 0) {

    async function perguntarData() {
        const hoje = new Date();
        const mes = hoje.getMonth() + 1;
        const ano = hoje.getFullYear();

        await carregarDatasDisponiveis(mes, ano);

        if (datasDisponiveis.length === 0) {
            adicionarMensagemComDelay(
                '⚠️ Não encontrei datas disponíveis para este mês.<br><br>Tente os próximos dias ou entre em contato com a barbearia.',
                'bot', null, 600
            );
            estado = 'aguardando_data';
            return;
        }

        const datasOrdenadas = [...datasDisponiveis].sort();
        const primeiraData = datasOrdenadas[0];
        const partes = primeiraData.split('-');
        const mesData = parseInt(partes[1]);
        const anoData = parseInt(partes[0]);
        calendarioAtual = new Date(anoData, mesData - 1, 1);

        const calendario = renderizarCalendario();
        adicionarMensagemComDelay('📅 <strong>Selecione uma data disponível no calendário:</strong>', 'bot', calendario, 800);
        estado = 'aguardando_data';
    }

    async function carregarDatasDisponiveis(mes, ano) {
        const mesAtual = parseInt(mes) || new Date().getMonth() + 1;
        const anoAtual = parseInt(ano) || new Date().getFullYear();

        try {
            let profissionalIdParaEnviar = null;
            if (agendamentoAtual && agendamentoAtual.profissional_id) {
                const pid = agendamentoAtual.profissional_id;
                if (typeof pid === 'number' || (!isNaN(parseInt(pid)) && !String(pid).includes('dono'))) {
                    profissionalIdParaEnviar = parseInt(pid);
                }
            }

            const res = await fetch('/api/chatbot/datas-disponiveis-mes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    empresaId, mes: mesAtual, ano: anoAtual,
                    profissionalId: profissionalIdParaEnviar
                })
            });
            const data = await res.json();

            if (data.success && data.diasDisponiveis && data.diasDisponiveis.length > 0) {
                datasDisponiveis = data.diasDisponiveis;
            } else {
                datasDisponiveis = gerarDatasFallback(mesAtual, anoAtual);
            }
        } catch (error) {
            datasDisponiveis = gerarDatasFallback(mesAtual, anoAtual);
        }
    }

    function gerarDatasFallback(mes, ano) {
        const datas = [];
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        for (let i = 0; i <= 15; i++) {
            const data = new Date(hoje);
            data.setDate(data.getDate() + i);
            datas.push(data.toISOString().split('T')[0]);
        }
        return datas;
    }

    function renderizarCalendario() {
        const container = document.createElement('div');
        container.className = 'calendario-container';

        const mes = calendarioAtual.getMonth();
        const ano = calendarioAtual.getFullYear();
        const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
            'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

        const header = document.createElement('div');
        header.className = 'calendario-header';
        header.innerHTML = `
            <button class="calendario-nav" onclick="mudarMesCalendario(-1)">◀</button>
            <span style="font-weight:bold;font-size:16px;">${meses[mes]} ${ano}</span>
            <button class="calendario-nav" onclick="mudarMesCalendario(1)">▶</button>
        `;
        container.appendChild(header);

        const semanaDiv = document.createElement('div');
        semanaDiv.className = 'calendario-semana';
        for (let d of diasSemana) {
            const span = document.createElement('span');
            span.className = 'calendario-dia-semana';
            span.textContent = d;
            semanaDiv.appendChild(span);
        }
        container.appendChild(semanaDiv);

        const diasDiv = document.createElement('div');
        diasDiv.className = 'calendario-dias';

        const primeiroDia = new Date(ano, mes, 1);
        const ultimoDia = new Date(ano, mes + 1, 0);
        const primeiroDiaSemana = primeiroDia.getDay();
        const diasNoMes = ultimoDia.getDate();
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        const hojeStr = hoje.toISOString().split('T')[0];

        for (let i = 0; i < primeiroDiaSemana; i++) {
            const vazio = document.createElement('div');
            vazio.className = 'calendario-dia vazio';
            diasDiv.appendChild(vazio);
        }

        for (let dia = 1; dia <= diasNoMes; dia++) {
            const dataStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
            const isHoje = dataStr === hojeStr;
            const isDisponivel = datasDisponiveis.includes(dataStr);

            const diaDiv = document.createElement('div');
            diaDiv.className = 'calendario-dia';
            diaDiv.textContent = dia;

            if (isDisponivel) {
                diaDiv.style.cursor = 'pointer';
                diaDiv.style.backgroundColor = '#10b981';
                diaDiv.style.color = 'white';
                diaDiv.style.borderRadius = '50%';
                diaDiv.style.fontWeight = 'bold';
                diaDiv.style.width = '36px';
                diaDiv.style.height = '36px';
                diaDiv.style.display = 'flex';
                diaDiv.style.alignItems = 'center';
                diaDiv.style.justifyContent = 'center';

                (function (dataSelecionada) {
                    diaDiv.onclick = function () {
                        adicionarMensagemComDelay('📅 ' + formatarDataBr(dataSelecionada), 'user', null, 300);
                        agendamentoAtual.data = dataSelecionada;
                        estado = 'aguardando_horario';
                        perguntarHorario(dataSelecionada);
                    };
                })(dataStr);

                diaDiv.onmouseover = function () {
                    this.style.transform = 'scale(1.1)';
                    this.style.boxShadow = '0 4px 12px rgba(16, 185, 129, 0.4)';
                };
                diaDiv.onmouseout = function () {
                    this.style.transform = 'scale(1)';
                    this.style.boxShadow = 'none';
                };
            } else {
                diaDiv.style.color = '#9ca3af';
                diaDiv.style.width = '36px';
                diaDiv.style.height = '36px';
                diaDiv.style.display = 'flex';
                diaDiv.style.alignItems = 'center';
                diaDiv.style.justifyContent = 'center';
            }

            if (isHoje) {
                diaDiv.style.border = '2px solid #667eea';
                diaDiv.style.backgroundColor = '#e0e7ff';
                diaDiv.style.color = '#667eea';
                diaDiv.style.fontWeight = 'bold';
            }

            diasDiv.appendChild(diaDiv);
        }

        container.appendChild(diasDiv);

        const legenda = document.createElement('div');
        legenda.style.cssText = `
            display: flex; justify-content: center; gap: 20px;
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid #e5e7eb;
            font-size: 12px; color: #6b7280; flex-wrap: wrap;
        `;
        legenda.innerHTML = `
            <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#10b981;margin-right:4px;"></span> Disponível</span>
            <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#e5e7eb;margin-right:4px;"></span> Indisponível</span>
            <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #667eea;margin-right:4px;"></span> Hoje</span>
        `;
        container.appendChild(legenda);

        return container;
    }

    window.mudarMesCalendario = async function (delta) {
        calendarioAtual.setMonth(calendarioAtual.getMonth() + delta);
        const mes = calendarioAtual.getMonth() + 1;
        const ano = calendarioAtual.getFullYear();
        await carregarDatasDisponiveis(mes, ano);

        const containers = document.querySelectorAll('.calendario-container');
        const ultimoContainer = containers[containers.length - 1];
        if (ultimoContainer) {
            const parent = ultimoContainer.closest('.message-content');
            if (parent) {
                const novoCalendario = renderizarCalendario();
                parent.innerHTML = '';
                const newText = document.createElement('div');
                newText.className = 'message-text';
                newText.innerHTML = '📅 <strong>Selecione uma data:</strong>';
                parent.appendChild(newText);
                parent.appendChild(novoCalendario);
                const timeDiv = document.createElement('span');
                timeDiv.className = 'message-time';
                timeDiv.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                parent.appendChild(timeDiv);
            }
        }
    };

    async function perguntarHorario(data) {
        try {
            const body = { empresaId, data };
            if (agendamentoAtual.profissional_id && agendamentoAtual.profissional_id !== 'dono_') {
                body.profissionalId = agendamentoAtual.profissional_id;
            }

            const res = await fetch('/api/chatbot/horarios-disponiveis', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const result = await res.json();

            if (result.success && result.horarios && result.horarios.length > 0) {
                let horarios = result.horarios;
                const hoje = new Date();
                const hojeStr = hoje.toISOString().split('T')[0];
                const horaAtual = hoje.getHours();
                const minutoAtual = hoje.getMinutes();

                if (data === hojeStr) {
                    horarios = horarios.filter(h => {
                        const [hNum, mNum] = h.split(':').map(Number);
                        return hNum > horaAtual || (hNum === horaAtual && mNum >= minutoAtual);
                    });
                }

                if (horarios.length === 0) {
                    adicionarMensagemComDelay('⏰ Nenhum horário disponível para hoje.<br><br>Por favor, selecione outra data.', 'bot', null, 600);
                    estado = 'aguardando_data';
                    perguntarData();
                    return;
                }

                horariosDisponiveis = horarios;
                const dataFormatada = formatarDataBr(data);
                adicionarMensagemComHorarios(
                    `⏰ Para o dia <strong>${dataFormatada}</strong>, escolha o horário:`,
                    horariosDisponiveis
                );
            } else {
                adicionarMensagemComDelay(
                    '❌ Não há horários disponíveis para este profissional nesta data.<br><br>Por favor, escolha outra data ou outro profissional.',
                    'bot', null, 600
                );
                estado = 'aguardando_data';
                perguntarData();
            }
        } catch (error) {
            console.error('Erro ao carregar horários:', error);
            adicionarMensagemComDelay('❌ Erro ao carregar horários. Tente novamente.', 'bot', null, 500);
            estado = 'aguardando_data';
            perguntarData();
        }
    }

    async function verificarEConfirmar() {
        try {
            const res = await fetch('/api/chatbot/horarios-disponiveis', {

                body: JSON.stringify({
                    empresaId,

    function validarDataHora(data, hora) {
        if (!data || !hora) return { valido: false, mensagem: '⚠️ Data e hora são obrigatórias.' };

        const agora = new Date();
        const [ano, mes, dia] = data.split('-').map(Number);
        const [horaNum, minutoNum] = hora.split(':').map(Number);
        const dataSelecionada = new Date(ano, mes - 1, dia, horaNum || 0, minutoNum || 0, 0, 0);

        if (dataSelecionada < agora) {
            const hoje = new Date();
            const isHoje = dataSelecionada.getDate() === hoje.getDate() &&
                dataSelecionada.getMonth() === hoje.getMonth() &&
                dataSelecionada.getFullYear() === hoje.getFullYear();

            let mensagem = '⏰ Não é possível agendar em datas ou horários que já passaram!';
            if (isHoje) mensagem = '⏰ Este horário já passou hoje! Por favor, selecione um horário futuro.';
            else mensagem = '⏰ Esta data já passou! Por favor, selecione uma data futura.';

            return { valido: false, mensagem };
        }
        return { valido: true, mensagem: '✅ Data e hora válidas!' };
    }

    async function finalizarAgendamento() {
        try {
            const validacao = validarDataHora(agendamentoAtual.data, agendamentoAtual.hora);
            if (!validacao.valido) {
                adicionarMensagemComDelay(`❌ ${validacao.mensagem}`, 'bot', null, 600);
                estado = 'aguardando_horario';
                perguntarHorario(agendamentoAtual.data);
                return;
            }

            if (!clienteAtual || !clienteAtual.id) {
                adicionarMensagemComDelay('❌ Erro: Cliente não identificado.', 'bot', null, 500);
                estado = 'inicio';
                return;
            }
            if (!agendamentoAtual.servico_id) {
                adicionarMensagemComDelay('❌ Erro: Serviço não identificado.', 'bot', null, 500);
                estado = 'inicio';
                return;
            }
            if (!agendamentoAtual.data || !agendamentoAtual.hora) {
                adicionarMensagemComDelay('❌ Erro: Data ou horário não selecionados.', 'bot', null, 500);
                estado = 'inicio';
                return;
            }

            let valorFinal = parseFloat(agendamentoAtual.valor) || 0;

            if (valorFinal === 0 && agendamentoAtual.servico_id) {
                try {
                    const resServico = await fetch(`/api/chatbot/servico/${agendamentoAtual.servico_id}`);
                    const dataServico = await resServico.json();
                    if (dataServico.success && dataServico.servico) {
                        valorFinal = parseFloat(dataServico.servico.valor) || 0;
                        if (dataServico.servico.nome) agendamentoAtual.servico_nome = dataServico.servico.nome;
                    }
                } catch (e) {}
            }

            if (valorFinal === 0 && servicosList.length > 0) {
                const servicoEncontrado = servicosList.find(s =>
                    s.id == agendamentoAtual.servico_id || s.nome === agendamentoAtual.servico_nome
                );
                if (servicoEncontrado) {
                    valorFinal = parseFloat(servicoEncontrado.valor) || 0;
                    if (servicoEncontrado.nome) agendamentoAtual.servico_nome = servicoEncontrado.nome;
                }
            }

            agendamentoAtual.valor = valorFinal;

            let empresaIdFinal = empresaId;
            if (!empresaIdFinal) {
                const params = new URLSearchParams(window.location.search);
                empresaIdFinal = params.get('empresa') || '1';
            }

            let profissionalId = agendamentoAtual.profissional_id;
            if (profissionalId && typeof profissionalId === 'string' && profissionalId.includes('dono')) profissionalId = null;
            if (agendamentoAtual.profissional_nome === 'Qualquer profissional') profissionalId = null;

            const body = {
                clienteId: parseInt(clienteAtual.id),
                servicoId: parseInt(agendamentoAtual.servico_id),
                profissionalId: profissionalId ? parseInt(profissionalId) : null,
                data: agendamentoAtual.data,
                hora: agendamentoAtual.hora,
                empresaId: parseInt(empresaIdFinal),
                valor: valorFinal,
                servicoNome: agendamentoAtual.servico_nome || '',
                origem: 'chatbot'
            };

            const res = await fetch('/api/chatbot/agendar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const result = await res.json();

            if (result.success) {
                const dataFormatada = formatarDataBr(agendamentoAtual.data);
                const valorExibicao = parseFloat(agendamentoAtual.valor) || 0;
                const valorFinalFormatado = valorExibicao.toFixed(2).replace('.', ',');
                const msgSucesso = getMensagemHumanizada('sucesso');

                adicionarMensagemComDelay(
                    `✅ <strong>AGENDAMENTO CONFIRMADO, ${clienteAtual.nome}!</strong><br><br>` +
                    `${msgSucesso}<br><br>` +
                    '📋 <strong>Resumo:</strong><br>' +
                    '📅 Data: ' + dataFormatada + ' às ' + agendamentoAtual.hora + '<br>' +
                    '👨‍💼 Profissional: ' + (agendamentoAtual.profissional_nome || 'Não definido') + '<br>' +
                    '✂️ Serviço: ' + agendamentoAtual.servico_nome + '<br>' +
                    '💰 Valor: R$ ' + valorFinalFormatado + '<br><br>' +
                    '🔔 Você receberá um lembrete próximo ao horário.<br><br>' +
                    'Obrigado por escolher a ' + (dadosEmpresa?.nome || 'nossa barbearia') + '! ✨',
                    'bot', null, 800
                );
                estado = 'inicio';
                agendamentoAtual = {};
            } else {
                const msgErro = getMensagemHumanizada('erro');
                adicionarMensagemComDelay(
                    `❌ ${msgErro}<br><br>${result.message || 'Erro desconhecido'}<br><br>Tente novamente.`,
                    'bot', null, 600
                );
                estado = 'inicio';
            }
        } catch (error) {
            console.error('❌ Erro ao finalizar agendamento:', error);
            const msgErro = getMensagemHumanizada('erro');
            adicionarMensagemComDelay(`❌ ${msgErro}`, 'bot', null, 500);
            estado = 'inicio';
        }
    }

    function formatarDataBr(dataStr) {
        if (!dataStr) return '-';
        try {
            if (typeof dataStr === 'string' && dataStr.includes('-')) {
                const partes = dataStr.split('-');
                if (partes.length === 3) return partes[2] + '/' + partes[1] + '/' + partes[0];
            }
            return dataStr;
        } catch {
            return dataStr;
        }
    }

    // ============================================
    // 🧠 MEMÓRIA DO CLIENTE
    // ============================================
    async function carregarHistoricoCliente(clienteId) {
        try {
            const res = await fetch(`/api/chatbot/cliente/${clienteId}/historico?empresaId=${empresaId}`);
            const data = await res.json();
            if (data.success) {
                console.log('🧠 Histórico carregado:', data);
                return data;
            }
            return null;
        } catch (error) {
            console.error('❌ Erro ao carregar histórico:', error);
            return null;
        }
    }

    function tempoDesde(dataStr) {
        if (!dataStr) return '';
        try {
            const [ano, mes, dia] = dataStr.split('-').map(Number);
            const data = new Date(ano, mes - 1, dia);
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            data.setHours(0, 0, 0, 0);
            const diffMs = hoje - data;
            const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            if (diffDias === 0) return 'hoje';
            if (diffDias === 1) return 'ontem';
            if (diffDias < 7) return `há ${diffDias} dias`;
            if (diffDias < 30) {
                const semanas = Math.floor(diffDias / 7);
                return `há ${semanas} semana${semanas > 1 ? 's' : ''}`;
            }
            const meses = Math.floor(diffDias / 30);
            return `há ${meses} ${meses > 1 ? 'meses' : 'mês'}`;
        } catch {
            return '';
        }
    }

    function proximaDataPorDiaSemana(diaSemana) {
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        const diaAtual = hoje.getDay();
        let diff = diaSemana - diaAtual;
        if (diff <= 0) diff += 7;
        const proxima = new Date(hoje);
        proxima.setDate(proxima.getDate() + diff);
        const ano = proxima.getFullYear();
        const mes = String(proxima.getMonth() + 1).padStart(2, '0');
        const dia = String(proxima.getDate()).padStart(2, '0');
        return `${ano}-${mes}-${dia}`;
    }

    function nomeDiaSemana(dia) {
        const dias = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
        return dias[dia] || '';
    }

    window.enviarMensagem = enviarMensagem;
    window.mudarMesCalendario = window.mudarMesCalendario;

    console.log('✅ chatbot.js carregado! (v5 - com memória do cliente)');
    </script>

            }

        function trocarAnuncio() {
            const header = document.getElementById('adsHeader');
            if (!header) return;
            header.classList.add('ads-fade-out');
            setTimeout(() => {
                const ad = ads[idx % ads.length];
                idx++;
                renderizarAnuncio(ad);
                header.classList.remove('ads-fade-out');
                header.classList.add('ads-fade-in');
                setTimeout(() => header.classList.remove('ads-fade-in'), 250);
            }, 200);
        }

        function initAds() {
            const header = document.getElementById('adsHeader');
            if (!header) return;
            setTimeout(trocarAnuncio, 800);
            setInterval(trocarAnuncio, 15000);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAds);
        } else {
            initAds();
        }
    })();
